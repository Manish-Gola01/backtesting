# Optional in Phase 1 — required from Phase 3 (database).
# Usage: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: backtesting-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-backtesting}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backtesting"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
